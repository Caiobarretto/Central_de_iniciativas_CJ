<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carregando credenciais | Central CJ</title><link rel="icon" href="/favicon.png"><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#172444;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{max-width:480px;width:100%;padding:44px;text-align:center;background:white;border:1px solid #e3e7ef;border-radius:24px;box-shadow:0 20px 60px #17244412}.brand{font-size:12px;letter-spacing:1.3px;font-weight:700;color:#ad1739}.emblem{position:relative;width:104px;height:104px;margin:30px auto 24px;display:grid;place-items:center}.disc{width:80px;height:80px;border-radius:24px;background:linear-gradient(140deg,#eef2ff,#fce8ed);display:grid;place-items:center}.disc svg{width:42px;height:42px;color:#293b69}.ring{position:absolute;inset:0;border:2px solid #e9edf6;border-top-color:#b61940;border-radius:50%;animation:orbit 2.5s linear infinite}.spark{position:absolute;right:5px;top:10px;width:11px;height:11px;background:#b61940;border:3px solid white;border-radius:50%}h1{font-size:26px;line-height:1.25;margin:0 0 12px}p{color:#61708a;line-height:1.5;margin:10px 0}.identity{font-size:13px;overflow-wrap:anywhere;min-height:20px}.track{height:9px;overflow:hidden;border-radius:20px;background:#e9edf6;margin:25px 0 10px}.fill{width:0%;height:100%;background:linear-gradient(90deg,#273c72,#b61940);border-radius:20px}.percent{font-size:13px;color:#61708a;font-variant-numeric:tabular-nums}small{display:block;font-size:12px;color:#738097;line-height:1.5;margin-top:22px}.error{color:#ad1739}button{border:1px solid #d9dfeb;padding:10px 15px;background:white;color:#172444;border-radius:8px;font:inherit;cursor:pointer;margin-top:15px}[hidden]{display:none!important}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ring{animation:none}}@media(max-width:480px){.panel{padding:30px 24px}h1{font-size:24px}}</style></head><body><main class="panel"><div class="brand">CONTROLADORIA JURÍDICA · QCA</div><div class="emblem" aria-hidden="true"><div class="ring"></div><div class="disc"><svg viewBox="0 0 48 48" fill="none"><path d="M24 5 39 11v12c0 10-7 16-15 20C16 39 9 33 9 23V11L24 5Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="m17 24 5 5 10-11" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="spark"></span></div><h1>Carregando credenciais</h1><p id="status" aria-live="polite">Preparando seu acesso à Central…</p><p class="identity" id="identity"></p><div class="track" id="progress" role="progressbar" aria-label="Carregamento da Central" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div><div class="percent" id="percent">0%</div><button type="button" id="retry" hidden>Tentar novamente</button><small>Central de iniciativas | CJ</small></main><script>
let running=false;
async function begin(){if(running)return;running=true;document.getElementById('retry').hidden=true;const status=document.getElementById('status');status.className='';try{const r=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();if(data.enabled&&!data.user){location.replace('/');return}if(data.user)document.getElementById('identity').textContent=data.user.name+' · '+data.user.email;const start=performance.now();function tick(now){const value=Math.min(100,Math.floor((now-start)/100));document.getElementById('fill').style.width=value+'%';document.getElementById('progress').setAttribute('aria-valuenow',value);document.getElementById('percent').textContent=value+'%';if(now-start>=10000){status.textContent='Abrindo a Central…';location.replace('/central')}else requestAnimationFrame(tick)}requestAnimationFrame(tick)}catch(e){running=false;status.className='error';status.textContent='Não foi possível verificar seu acesso. Tente novamente.';document.getElementById('retry').hidden=false}}
document.getElementById('retry').onclick=begin;addEventListener('pageshow',e=>{if(e.persisted)location.reload()});begin();
</script></body></html>
